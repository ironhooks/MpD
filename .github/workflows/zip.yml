
name: GitHub Repository ZIP Downloader

on:
  workflow_dispatch:
    inputs:
      repo_url:
        description: "Enter GitHub Repository URL"
        required: true
        type: string

permissions:
  contents: read
  actions: write

jobs:
  download:
    runs-on: ubuntu-latest

    steps:
      - name: Validate Repository URL
        shell: bash
        run: |
          URL="${{ inputs.repo_url }}"

          if [[ ! "$URL" =~ ^https://github\.com/[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+(\.git)?/?$ ]]; then
            echo "Invalid GitHub repository URL"
            exit 1
          fi

      - name: Clone Repository
        run: |
          git clone --depth 1 "${{ inputs.repo_url }}" source

      - name: Create ZIP
        run: |
          cd source
          zip -r ../repository.zip . -x ".git/*"

      - name: Upload ZIP
        uses: actions/upload-artifact@v4
        with:
          name: downloaded-repository
          path: repository.zip
          compression-level: 0
          retention-days: 7
