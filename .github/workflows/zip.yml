
name: Google Drive ZIP Downloader

on:
  workflow_dispatch:
    inputs:
      drive_url:
        description: "Google Drive Folder URL"
        required: true
        default: "https://drive.google.com/drive/folders/16q1FuUNB67jvA1l0t-P74ZUxwv4Pq8hk"
        type: string

permissions:
  contents: read
  actions: write

jobs:
  download:
    runs-on: ubuntu-latest

    steps:
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Downloader
        run: |
          python -m pip install --upgrade gdown

      - name: Download Google Drive Folder
        env:
          DRIVE_URL: ${{ inputs.drive_url }}
        run: |
          mkdir -p download

          gdown "$DRIVE_URL" \
            -O download \
            --no-cookies \
            --continue \
            --retries 3

      - name: Create ZIP File
        run: |
          if [ -z "$(find download -type f -print -quit)" ]; then
            echo "No files downloaded!"
            exit 1
          fi

          cd download
          zip -r ../SFX-Folder.zip .

      - name: Upload ZIP Artifact
        uses: actions/upload-artifact@v4
        with:
          name: SFX-Folder-ZIP
          path: SFX-Folder.zip
          compression-level: 0
          retention-days: 7
