
name: Google Drive Folder ZIP Downloader

on:
  workflow_dispatch:
    inputs:
      drive_url:
        description: "Google Drive Folder URL"
        required: true
        type: string

permissions:
  contents: read

jobs:
  download:
    runs-on: ubuntu-latest

    steps:
      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y rclone zip

      - name: Extract Folder ID
        id: folder
        env:
          DRIVE_URL: ${{ inputs.drive_url }}
        run: |
          ID=$(echo "$DRIVE_URL" | grep -oE '[A-Za-z0-9_-]{20,}' | head -1)

          if [ -z "$ID" ]; then
            echo "Invalid Google Drive URL"
            exit 1
          fi

          echo "id=$ID" >> "$GITHUB_OUTPUT"

      - name: Configure Google Drive
        run: |
          mkdir -p ~/.config/rclone

          cat > ~/.config/rclone/rclone.conf <<'EOF'
          [gdrive]
          type = drive
          scope = drive.readonly
          team_drive =
          EOF

      - name: Download Folder
        env:
          FOLDER_ID: ${{ steps.folder.outputs.id }}
        run: |
          mkdir -p download

          rclone copy \
            "gdrive:{${FOLDER_ID}}" \
            download \
            --drive-shared-with-me \
            --progress

      - name: Create ZIP
        run: |
          cd download
          zip -r ../GoogleDrive-Files.zip .

      - name: Upload ZIP
        uses: actions/upload-artifact@v4
        with:
          name: GoogleDrive-Files
          path: GoogleDrive-Files.zip
          retention-days: 7
